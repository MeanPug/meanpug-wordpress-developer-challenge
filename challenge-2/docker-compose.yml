version: '3.7'

services:
   db:
     image: mysql:5.7
     volumes:
       - db_data:/var/lib/mysql
     restart: always
     ports:
       - "3306:3306"
     environment:
       MYSQL_ROOT_PASSWORD: somewordpress
       MYSQL_DATABASE: wordpress
       MYSQL_USER: wordpress
       MYSQL_PASSWORD: wordpress

   static:
    build:
      dockerfile: docker/static/Dockerfile
      context: .
    command: ["run", "dev"]
    volumes:
      - ./webpack:/code/webpack
      - ./gulpfile.js:/code/gulpfile.js
      - ./tailwind.config.js:/code/tailwind.config.js
      - ./theme:/code/theme

   # One-shot init container: installs PHP dependencies (Advanced Custom Fields)
   # into mu-plugins/ before WordPress boots. wordpress waits for this to finish
   # (see depends_on below), so `docker compose up` works on a clean clone no
   # matter whether the developer ran `composer install` by hand first.
   composer:
    image: composer:2
    working_dir: /app
    command: ["install", "--no-interaction", "--no-progress"]
    volumes:
      - ./:/app

   wordpress:
     depends_on:
       db:
         condition: service_started
       static:
         condition: service_started
       composer:
         condition: service_completed_successfully
     image: wordpress:latest
     volumes:
       # Must-use loader that bootstraps the schema plugin automatically.
       # WordPress auto-loads anything in wp-content/mu-plugins/, so this file
       # runs on every request with no admin activation. (The repo keeps it in a
       # top-level mu-plugins/ dir purely for clarity; the mount is what places
       # it in the location WordPress actually reads from.)
       - ./mu-plugins/pug-puggle-schema-loader.php:/var/www/html/wp-content/mu-plugins/pug-puggle-schema-loader.php
       # The infra theme depends on Advanced Custom Fields. ACF is installed via
       # Composer into mu-plugins/ (see composer.json) and booted by acf-loader.php,
       # so get_field() works on a clean `docker compose up` with no admin activation.
       - ./mu-plugins/acf-loader.php:/var/www/html/wp-content/mu-plugins/acf-loader.php
       - ./mu-plugins/advanced-custom-fields:/var/www/html/wp-content/mu-plugins/advanced-custom-fields
       - wp_plugins:/var/www/html/wp-content/plugins
       # Bind-mount the schema plugin as a must-use plugin so a fresh `docker compose up`
       # is fully reproducible AND it never appears in the activatable Plugins list.
       # The root loader above require_once's its bootstrap on every request.
       - ./plugins/pug-puggle-schema:/var/www/html/wp-content/mu-plugins/pug-puggle-schema
       - ./theme:/var/www/html/wp-content/themes/challenge-2-theme
       - ./uploads:/var/www/html/wp-content/uploads
       - ./server_config.ini:/usr/local/etc/php/conf.d/server_config.ini
       - ./wp:/var/www/html
     ports:
       - "8000:80"
     restart: always
     environment:
       WORDPRESS_DB_HOST: db:3306
       WORDPRESS_DB_USER: wordpress
       WORDPRESS_DB_PASSWORD: wordpress
       WP_ENVIRONMENT_TYPE: development
volumes:
    db_data:
    wp_plugins:
