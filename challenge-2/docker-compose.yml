version: '3.8'

services:
   db:
     image: mysql:8.0
     volumes:
       - db_data:/var/lib/mysql
     restart: always
     ports:
       - "3306:3306"
     environment:
       MYSQL_ROOT_PASSWORD: somewordpress
       MYSQL_DATABASE: wordpress
       MYSQL_USER: wordpress
       MYSQL_PASSWORD: wordpress

   static:
    build:
      dockerfile: docker/static/Dockerfile
      context: .
    command: ["run", "dev"]
    volumes:
      - ./webpack:/code/webpack
      - ./gulpfile.js:/code/gulpfile.js
      - ./tailwind.config.js:/code/tailwind.config.js
      - ./theme:/code/theme

   wordpress:
     depends_on:
       - db
       - static
     image: wordpress:6.7-php8.2-apache
     volumes:
       - wp_plugins:/var/www/html/wp-content/plugins
       - ./theme:/var/www/html/wp-content/themes/challenge-2-theme
       - ./uploads:/var/www/html/wp-content/uploads
       - ./server_config.ini:/usr/local/etc/php/conf.d/server_config.ini
       - ./wp:/var/www/html
     ports:
       - "8000:80"
     restart: always
     environment:
       WORDPRESS_DB_HOST: db:3306
       WORDPRESS_DB_USER: wordpress
       WORDPRESS_DB_PASSWORD: wordpress
       WP_ENVIRONMENT_TYPE: development

   wpcli:
     image: wordpress:cli-2.10-php8.2
     depends_on:
       - db
       - wordpress
     user: "33:33"
     volumes:
       - wp_plugins:/var/www/html/wp-content/plugins
       - ./theme:/var/www/html/wp-content/themes/challenge-2-theme
       - ./uploads:/var/www/html/wp-content/uploads
       - ./wp:/var/www/html
       - ./docker/wpcli/init.sh:/usr/local/bin/init.sh:ro
     environment:
       WORDPRESS_DB_HOST: db:3306
       WORDPRESS_DB_USER: wordpress
       WORDPRESS_DB_PASSWORD: wordpress
       WORDPRESS_DB_NAME: wordpress
     entrypoint: ["sh", "/usr/local/bin/init.sh"]
     restart: "no"

volumes:
    db_data:
    wp_plugins:
